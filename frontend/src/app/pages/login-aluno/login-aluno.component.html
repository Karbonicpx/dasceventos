<div class="pagina-estreita">
  <div class="cartao">
    <h2>Entrar como aluno</h2>
    <form (ngSubmit)="entrar()">
      <label>
        E-mail
        <input type="email" name="email" [(ngModel)]="email" required />
      </label>
      <label>
        Senha
        <input type="password" name="senha" [(ngModel)]="senha" required />
      </label>
      <p class="erro" *ngIf="erro">{{ erro }}</p>
      <button type="submit">Entrar</button>
    </form>
    <p class="link-rodape">Não tem conta? <a routerLink="/cadastro-aluno">Cadastre-se</a></p>
    <p class="link-rodape"><a routerLink="/login-admin">Entrar como diretoria do DASC</a></p>
  </div>
</div>
