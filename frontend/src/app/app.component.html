<header class="topo">
  <div class="topo-conteudo">
    <a routerLink="/eventos" class="marca">
      <img src="logo.png" alt="DASC" class="marca-logo" />
      <span class="marca-texto">DASC<strong>Eventos</strong></span>
    </a>

    <nav class="nav-principal">
      <a routerLink="/eventos" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Eventos
      </a>

      <ng-container *ngIf="!authService.estaLogado()">
        <a routerLink="/login" routerLinkActive="ativo">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          Entrar
        </a>
        <a routerLink="/cadastro" class="nav-cta">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          Cadastre-se
        </a>
      </ng-container>

      <ng-container *ngIf="authService.estaLogado() && !authService.ehAdministrador()">
        <a routerLink="/minhas-inscricoes" routerLinkActive="ativo">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          Minhas Inscrições
        </a>
        <a routerLink="/conta" routerLinkActive="ativo" class="nav-usuario">
          <img *ngIf="authService.usuarioAtual()?.fotoPerfil" [src]="authService.usuarioAtual()?.fotoPerfil" class="avatar-nav" alt="" />
          <svg *ngIf="!authService.usuarioAtual()?.fotoPerfil" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Meu Perfil
        </a>
        <a (click)="sair()" class="nav-sair">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Sair
        </a>
      </ng-container>

      <ng-container *ngIf="authService.ehAdministrador()">
        <a routerLink="/admin" routerLinkActive="ativo">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Painel DASC
        </a>
        <a routerLink="/conta" routerLinkActive="ativo" class="nav-usuario">
          <img *ngIf="authService.usuarioAtual()?.fotoPerfil" [src]="authService.usuarioAtual()?.fotoPerfil" class="avatar-nav" alt="" />
          <svg *ngIf="!authService.usuarioAtual()?.fotoPerfil" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Meu Perfil
        </a>
        <a (click)="sair()" class="nav-sair">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Sair
        </a>
      </ng-container>
    </nav>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="rodape">
  <p>DASC &middot; Diretório Acadêmico de Engenharia de Computação e Sistemas de Informação &middot; UTFPR Curitiba</p>
  <p class="rodape-sub">Projeto acadêmico de Projeto e Análise de Algoritmos &mdash; DASCEventos 2026</p>
</footer>
